services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - notification-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.23
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: .
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: python -m app.worker

volumes:
  notification-postgres:
